name: Android APK Release (fork)

on:
    workflow_dispatch:
        inputs:
            source_commit:
                description: 'Full 40-character commit SHA to build'
                required: true
                type: string
            version_code:
                description: 'Increasing Android versionCode (positive integer)'
                required: true
                type: string
            version_name:
                description: 'APK versionName, e.g. 0.30.7-main.20261005.5153ff23'
                required: true
                type: string
            release_tag:
                description: 'New tag starting with android-, e.g. android-main-20261005-5153ff23'
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: android-apk-release
    cancel-in-progress: false

jobs:
    release:
        if: github.repository == 'Hashmapw/hapi-sii' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: write
        env:
            SOURCE_COMMIT: ${{ inputs.source_commit }}
            VERSION_CODE: ${{ inputs.version_code }}
            VERSION_NAME: ${{ inputs.version_name }}
            RELEASE_TAG: ${{ inputs.release_tag }}
            HAPI_UPLOAD_KEY_ALIAS: hapi-sii
            HAPI_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.HAPI_SII_ANDROID_KEYSTORE_PASSWORD }}
            HAPI_UPLOAD_KEY_PASSWORD: ${{ secrets.HAPI_SII_ANDROID_KEYSTORE_PASSWORD }}
        steps:
            - name: Validate release inputs
              shell: bash
              run: |
                  set -euo pipefail
                  [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
                  [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]]
                  (( VERSION_CODE <= 2100000000 ))
                  [[ "$VERSION_NAME" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]]
                  [[ "$RELEASE_TAG" =~ ^android-[0-9A-Za-z][0-9A-Za-z._-]*$ ]]
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.source_commit }}
                  persist-credentials: false
            - name: Verify source
              run: |
                  set -euo pipefail
                  test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
                  test ! -e android/app/google-services.json
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'
            - uses: gradle/actions/setup-gradle@v4
            - name: Install fork signing key
              env:
                  KEYSTORE_BASE64: ${{ secrets.HAPI_SII_ANDROID_KEYSTORE_BASE64 }}
              run: |
                  set -euo pipefail
                  test -n "$KEYSTORE_BASE64"
                  test -n "$HAPI_UPLOAD_KEYSTORE_PASSWORD"
                  umask 077
                  HAPI_UPLOAD_KEYSTORE="$RUNNER_TEMP/hapi-sii.keystore"
                  printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HAPI_UPLOAD_KEYSTORE"
                  printf 'HAPI_UPLOAD_KEYSTORE=%s\n' "$HAPI_UPLOAD_KEYSTORE" >> "$GITHUB_ENV"
            - name: Test, lint and build signed release APK
              working-directory: android
              run: |
                  ./gradlew --no-daemon \
                      -PhapiVersionCode="$VERSION_CODE" \
                      -PhapiVersionName="$VERSION_NAME" \
                      :core:protocol:test :core:data:testDebugUnitTest :app:testDebugUnitTest \
                      :app:lintRelease :app:assembleRelease
            - name: Verify and package APK
              run: |
                  set -euo pipefail
                  mkdir release-artifacts
                  APK="hapi-sii-${VERSION_NAME}.apk"
                  cp android/app/build/outputs/apk/release/app-release.apk "release-artifacts/$APK"
                  BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
                  "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "release-artifacts/$APK" \
                      | tee release-artifacts/signature.txt
                  "$BUILD_TOOLS/aapt" dump badging "release-artifacts/$APK" > release-artifacts/apk-info.txt
                  python3 - <<'PY'
                  import json, os, pathlib
                  metadata = json.loads(pathlib.Path('android/app/build/outputs/apk/release/output-metadata.json').read_text())
                  assert metadata['applicationId'] == 'run.hapi.companion'
                  assert len(metadata['elements']) == 1
                  apk = metadata['elements'][0]
                  assert apk['versionCode'] == int(os.environ['VERSION_CODE'])
                  assert apk['versionName'] == os.environ['VERSION_NAME']
                  assert 'application-debuggable' not in pathlib.Path('release-artifacts/apk-info.txt').read_text()
                  info = {
                      'repository': os.environ['GITHUB_REPOSITORY'],
                      'source_commit': os.environ['SOURCE_COMMIT'],
                      'version_code': apk['versionCode'],
                      'version_name': apk['versionName'],
                      'application_id': metadata['applicationId'],
                      'firebase_push': False,
                      'workflow_commit': os.environ['GITHUB_SHA'],
                      'run_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                  }
                  pathlib.Path('release-artifacts/build-info.json').write_text(json.dumps(info, indent=2) + '\n')
                  PY
                  (cd release-artifacts && sha256sum -- *.apk apk-info.txt signature.txt build-info.json > checksums.txt)
            - uses: actions/upload-artifact@v4
              with:
                  name: hapi-sii-android-${{ inputs.version_code }}
                  if-no-files-found: error
                  path: release-artifacts/
            - name: Publish GitHub prerelease
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  cat > "$RUNNER_TEMP/release-notes.md" <<EOF
                  Android APK built from main snapshot commit [$SOURCE_COMMIT](https://github.com/$GITHUB_REPOSITORY/commit/$SOURCE_COMMIT).

                  - Version: $VERSION_NAME (Android versionCode $VERSION_CODE).
                  - Requires Android 8.0 / API 26 or newer and an HTTPS HAPI hub.
                  - Signed with a persistent key belonging to this fork; future APKs using the same key and a higher versionCode can update this build.
                  - This build has no Firebase configuration, so background push notifications are unavailable.
                  - The package ID is run.hapi.companion. A build from another signer must be uninstalled before installing this APK; uninstalling removes its local app data.
                  - Validation: protocol/data/app unit tests, release lint, release APK build, and APK signature verification. Device installation and live hub pairing have not been tested.
                  - Build provenance, APK metadata, signing certificate fingerprint and SHA-256 checksums are attached.

                  This is an unofficial main snapshot from Hashmapw/hapi-sii, not an upstream stable release.
                  EOF
                  gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                      --target "$SOURCE_COMMIT" --prerelease \
                      --title "HAPI Android $VERSION_NAME" \
                      --notes-file "$RUNNER_TEMP/release-notes.md" \
                      release-artifacts/*
            - name: Remove signing key
              if: always()
              run: rm -f -- "$RUNNER_TEMP/hapi-sii.keystore"
